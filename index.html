<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030203;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    }
    canvas {
      display: block;
      background-color: #030203;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script>
    // System Constants & Setup
    const SIZE = 8;
    const FPS = 30;
    const D2R = Math.PI / 180;

    const T_ENV_IN = 1.6;
    const T_CUR0 = 1.9;
    const T_CUR1 = 4.1;
    const T_CLICK = 4.55;
    const T_BURN = T_CLICK + 0.12;
    const T_SPREAD = 3.4;
    const T_R0 = T_BURN + 2.3;
    const T_FORM = 3.8;
    const T_GLOW = T_R0 + 1.8;
    const T_FIRE_END = T_BURN + T_SPREAD + 2.2;

    // Pseudo Random Generator (seeded)
    class Random {
      constructor(seed) {
        this.m = 0x80000000;
        this.a = 1103515245;
        this.c = 12345;
        this.state = seed ? seed : Math.floor(Math.random() * (this.m - 1));
      }
      nextInt() {
        this.state = (this.a * this.state + this.c) % this.m;
        return this.state;
      }
      random() {
        return this.nextInt() / (this.m - 1);
      }
      uniform(min, max) {
        return min + this.random() * (max - min);
      }
      randrange(min, max) {
        if (max === undefined) { max = min; min = 0; }
        return Math.floor(this.uniform(min, max));
      }
      shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(this.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }
    }

    const rng = new Random(21);

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Grid Dimensions
    const CW = SIZE * 0.6;
    const CH = SIZE * 1.2;
    const ROWS = 42;
    const COLS = Math.floor(ROWS * CH / CW);
    const W = COLS * CW;
    const H = ROWS * CH;
    const S = H / 640.0;

    canvas.width = W;
    canvas.height = H;

    const BG = [0.010, 0.007, 0.012];

    function clamp(v, lo = 0.0, hi = 1.0) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function ease(t) {
      t = clamp(t);
      return t * t * (3 - 2 * t);
    }

    function mix(a, b, k) {
      return [
        a[0] + (b[0] - a[0]) * k,
        a[1] + (b[1] - a[1]) * k,
        a[2] + (b[2] - a[2]) * k
      ];
    }

    function sc(c, k) {
      return [c[0] * k, c[1] * k, c[2] * k];
    }

    function hexc(c) {
      const r = Math.floor(clamp(c[0]) * 255);
      const g = Math.floor(clamp(c[1]) * 255);
      const b = Math.floor(clamp(c[2]) * 255);
      return `rgb(${r},${g},${b})`;
    }

    // Perlin / Value Noise
    const _P = Array.from({ length: 256 }, (_, i) => i);
    rng.shuffle(_P);
    const _N = Array.from({ length: 256 }, () => rng.uniform(-1, 1));

    function vn(x, y) {
      const xi = Math.floor(x) & 255;
      const yi = Math.floor(y) & 255;
      const xf = x - Math.floor(x);
      const yf = y - Math.floor(y);
      const x1 = (xi + 1) & 255;
      const y1 = (yi + 1) & 255;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      const a = _N[_P[(_P[xi] + yi) & 255]];
      const b = _N[_P[(_P[x1] + yi) & 255]];
      const c = _N[_P[(_P[xi] + y1) & 255]];
      const d = _N[_P[(_P[x1] + y1) & 255]];
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    }

    function nz(t, a = 1.0) {
      return (Math.sin(t * 2.1 * a) + 0.7 * Math.sin(t * 3.3 * a + 1.7) + 0.4 * Math.sin(t * 5.7 * a + 0.6)) / 2.1;
    }

    function ramp_lut(stops, n = 64) {
      const out = [];
      for (let i = 0; i < n; i++) {
        const v = i / (n - 1);
        for (let k = 0; k < stops.length - 1; k++) {
          const [a, ca] = stops[k];
          const [b, cb] = stops[k + 1];
          if (v <= b) {
            out.push(mix(ca, cb, (v - a) / (b - a)));
            break;
          }
        }
      }
      return out;
    }

    const FIRE = [
      [0.00, [0.30, 0.01, 0.00]],
      [0.18, [0.78, 0.05, 0.01]],
      [0.38, [1.00, 0.24, 0.02]],
      [0.60, [1.00, 0.52, 0.05]],
      [0.80, [1.00, 0.80, 0.26]],
      [1.00, [1.00, 0.98, 0.82]]
    ];
    const LUT = ramp_lut(FIRE);

    const REDS = [
      [0.00, [0.10, 0.00, 0.02]],
      [0.22, [0.34, 0.01, 0.05]],
      [0.45, [0.66, 0.04, 0.09]],
      [0.68, [0.90, 0.09, 0.15]],
      [0.88, [1.00, 0.24, 0.26]],
      [1.00, [1.00, 0.55, 0.52]]
    ];
    const RLUT = ramp_lut(REDS);
    const RCH = "-=+*#%&@8";

    const BLUES = [
      [0.00, [0.01, 0.03, 0.16]],
      [0.25, [0.03, 0.14, 0.52]],
      [0.50, [0.10, 0.38, 0.95]],
      [0.75, [0.50, 0.78, 1.00]],
      [1.00, [1.00, 1.00, 1.00]]
    ];
    const BLUE = ramp_lut(BLUES);

    const CX = W / 2.0;
    const EW = 0.76 * W;
    const EH = 0.74 * EW;
    const ECY = 0.55 * H;
    const EX0 = CX - EW / 2;
    const EX1 = CX + EW / 2;
    const EY0 = ECY - EH / 2;
    const EY1 = ECY + EH / 2;
    const FLAP_H = 0.50 * EH;
    const TIPY = EY0 + FLAP_H;
    const HR = 0.062 * H;
    const HCY = TIPY - 0.25 * HR;

    function heart_f(hx, hy, s) {
      const X = hx / s;
      const Y = (hy - 0.25) / s + 0.25;
      return Math.pow(X * X + Y * Y - 1, 3) - X * X * Math.pow(Y, 3);
    }

    function in_seal(x, y) {
      const hx_ = (x - CX) / HR;
      const hy_ = (HCY - y) / HR;
      return hx_ > -1.4 && hx_ < 1.4 && hy_ > -1.3 && hy_ < 1.6 && heart_f(hx_, hy_, 1.0) <= 0;
    }

    // Animation Loop Variables
    let startTime = null;

    function drawCell(c, r, char, color) {
      ctx.fillStyle = hexc(color);
      ctx.fillText(char, c * CW, (r + 1) * CH - 2);
    }

    function renderFrame(timestamp) {
      if (!startTime) startTime = timestamp;
      const t = (timestamp - startTime) / 1000.0;

      ctx.fillStyle = hexc(BG);
      ctx.fillRect(0, 0, W, H);
      ctx.font = `bold ${SIZE}px monospace`;

      // Simple introductory visual for Web Canvas
      const pulse = 0.5 + 0.5 * Math.sin(t * 3);
      ctx.fillStyle = `rgba(255, 100, 150, ${pulse})`;
      ctx.fillText("FOR YOU", CX - 25, HCY);

      requestAnimationFrame(renderFrame);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
