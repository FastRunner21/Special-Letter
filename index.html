<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030203;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      background: #030203;
    }
    canvas {
      display: block;
      background-color: #030203;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Nastavení rozlišení mřížky (odpovídá Python verzi)
    const COLS = 80;
    const ROWS = 40;
    
    // Automatické přizpůsobení velikosti okna
    const CW = 12;
    const CH = 18;
    const W = COLS * CW;
    const H = ROWS * CH;
    
    canvas.width = W;
    canvas.height = H;

    // Načtení fontu pro terminálový vzhled
    ctx.font = "bold 14px 'Courier New', Courier, monospace";
    ctx.textBaseline = "top";

    let startTime = performance.now();
    let clicked = false;

    // Kliknutím lze animaci restartovat nebo popohnat
    window.addEventListener("click", () => {
      clicked = true;
      startTime = performance.now();
    });

    function render(now) {
      const t = (now - startTime) / 1000.0;

      // Vyčištění plátna
      ctx.fillStyle = "#030203";
      ctx.fillRect(0, 0, W, H);

      // Střed obrazovki
      const CX = W / 2;
      const CY = H / 2;

      // Vykreslení ASCII efektu růže a obálky (zjednodušená webová simulace)
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const x = c * CW;
          const y = r * CH;
          
          let char = "";
          let color = "#110515";

          const dx = x - CX;
          const dy = y - CY;
          const dist = Math.hypot(dx, dy);

          // Generování efektu růže uprostřed ve správný čas
          if (t > 2.0 && dist < 180 + Math.sin(t * 3 + r) * 15) {
            const angle = Math.atan2(dy, dx);
            const pattern = Math.sin(angle * 5 + t);
            
            if (dist < 60) {
              char = pattern > 0 ? "@" : "#";
              color = `rgb(255, ${Math.floor(50 + 100 * pattern)}, 80)`;
            } else if (dist < 120) {
              char = "%";
              color = `rgb(${Math.floor(200 + 55 * pattern)}, 20, 60)`;
            } else {
              char = "~";
              color = "rgb(30, 120, 40)"; // Lístky / stonek
            }
          } 
          // Okolní hvězdičky / pozadí
          else if ((r * 13 + c * 17) % 37 === 0) {
            char = ".";
            color = "#446699";
          }

          if (char) {
            ctx.fillStyle = color;
            ctx.fillText(char, x, y);
          }
        }
      }

      // Vykreslení nápisu "FOR YOU" dole nebo uprostřed
      if (t > 1.0) {
        ctx.fillStyle = "#ffc0cb";
        ctx.font = "bold 18px 'Courier New', monospace";
        ctx.fillText("FOR YOU", CX - 40, CY + 140);
        ctx.font = "bold 14px 'Courier New', Courier, monospace";
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
